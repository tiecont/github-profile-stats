name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: |
          npm ci --no-audit --no-fund
          node --check server.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tiecont/github-profile-stats:${{ github.sha }}

      - name: Update deployment image
        env:
          IMAGE: ghcr.io/tiecont/github-profile-stats:${{ github.sha }}
        run: sed -i -E "s#image: ghcr.io/tiecont/github-profile-stats:[^[:space:]]+#image: ${IMAGE}#" k8s/deployment.yaml

      - name: Commit manifest update
        run: |
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "Deployment already points at this image"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add k8s/deployment.yaml
          git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
          git push
