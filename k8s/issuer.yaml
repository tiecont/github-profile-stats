apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-production

spec:
  acme:
    email: ties.node@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-production-account-key

    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
